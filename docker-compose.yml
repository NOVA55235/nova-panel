################################################################
# Nova Panel — Docker Compose (nginx included by default)
#
# SETUP:
#   cp .env.docker .env
#   nano .env            ← set your passwords + domain
#   docker compose up -d
#
# ACCESS (no domain):    http://YOUR_VPS_IP
# ACCESS (with domain):  https://panel.yourdomain.com
################################################################

version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nova-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nova_panel
      POSTGRES_USER:     nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_panel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── First-run seed (creates admin user if DB is empty) ───────
  migrate:
    image: ${DOCKER_IMAGE:-nova-panel:latest}
    container_name: nova-migrate
    restart: "no"
    environment:
      DATABASE_URL:   postgresql://nova:${POSTGRES_PASSWORD:-changeme_strong_password}@postgres:5432/nova_panel
      SESSION_SECRET: ${SESSION_SECRET:-changeme_secret}
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-admin@gamepanel.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      PORT: "3000"
      NODE_ENV: production
    command: sh -c "node /app/seed.mjs && echo 'Done.'"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Nova Panel API + Frontend ────────────────────────────────
  panel:
    image: ${DOCKER_IMAGE:-nova-panel:latest}
    container_name: nova-panel
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL:   postgresql://nova:${POSTGRES_PASSWORD:-changeme_strong_password}@postgres:5432/nova_panel
      SESSION_SECRET: ${SESSION_SECRET:-changeme_secret}
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx reverse proxy (HTTP + optional HTTPS) ──────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nova-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nova-panel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - panel

volumes:
  postgres_data:
  nginx_logs:
