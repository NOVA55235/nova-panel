################################################################
# Nova Panel — Nginx configuration
#
# HTTP-only mode (default — works out of the box with just an IP):
#   No SSL cert needed. Panel accessible at http://YOUR_IP
#
# HTTPS mode (requires a domain + cert):
#   1. Run:  docker compose run --rm certbot
#      OR manually place cert.pem + key.pem in ./nginx/ssl/
#   2. Uncomment the HTTPS server block below
#   3. docker compose restart nginx
################################################################

# ── HTTP — works immediately, no domain needed ───────────────
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # Proxy to Nova Panel
    location / {
        proxy_pass         http://panel:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }
}

